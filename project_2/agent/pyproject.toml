[project]
name = "esolution-agent"
version = "1.0.0"
description = "LangGraph agent (Kie.ai Gemini 2.5 Flash) that connects to the ESolution MCP server as an OAuth-authenticated client"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.0,<2.0",
    # Pinned exactly: langchain-mcp-adapters==0.3.0 depends on an older
    # `mcp` SDK shape (it imports RequestContext from mcp.shared.context,
    # which newer `mcp` releases moved/renamed). Without pinning `mcp`
    # directly, pip resolves the newest `mcp` release and the import
    # breaks at startup — this combination is the one actually verified
    # working, both locally and in production.
    "langchain-mcp-adapters==0.3.0",
    "mcp==1.28.1",
    "langchain-openai>=0.2,<2.0",
    "langchain-core>=1.0,<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["src*"]
